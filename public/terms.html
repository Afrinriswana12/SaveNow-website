<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Terms & Conditions – SaveNow</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #ffffff;
      color: #111;
    }

    /* MAIN CONTAINER */
    .terms-container {
      max-width: 900px;
      margin: 120px auto 80px;
      padding: 0 20px;
      text-align: center;
    }

    /* TITLE */
    .terms-container h1 {
      font-size: 36px;
      font-weight: 500;
      margin-bottom: 12px;
    }

    .underline {
      width: 260px;
      height: 2px;
      background: #111;
      margin: 0 auto 70px;
    }

    /* EMAIL */
    .contact-email {
      font-size: 18px;
      margin-bottom: 60px;
    }

    /* SUBSCRIBE */
    .subscribe-text {
      font-size: 18px;
      margin-bottom: 20px;
    }

    .subscribe-box {
      display: flex;
      justify-content: center;
      margin-bottom: 120px;
    }

    .subscribe-box input {
      width: 320px;
      padding: 14px;
      font-size: 16px;
      border: 1px solid #777;
      outline: none;
    }

    .subscribe-box button {
      padding: 14px 18px;
      font-size: 18px;
      border: 1px solid #777;
      border-left: none;
      background: #fff;
      cursor: pointer;
    }

    /* FOOTER */
    footer {
      border-top: 1px solid #e5e5e5;
      padding: 25px 10px;
      font-size: 14px;
      color: #666;
      text-align: center;
    }

    footer a {
      color: #666;
      text-decoration: none;
      margin: 0 6px;
    }

    footer a:hover {
      text-decoration: underline;
    }

    /* RESPONSIVE */
    @media (max-width: 600px) {
      .terms-container h1 {
        font-size: 28px;
      }

      .subscribe-box {
        flex-direction: column;
        gap: 10px;
      }

      .subscribe-box input,
      .subscribe-box button {
        width: 100%;
        border: 1px solid #777;
      }

      .subscribe-box button {
        border-left: 1px solid #777;
      }
    }
  </style>
</head>

<body>

  <div class="terms-container">
    <h1>Terms & Conditions</h1>
    <div class="underline"></div>

    <div class="contact-email">
      savenow1683@gmail.com
    </div>

    <div class="subscribe-text">
      Subscribe to our emails
    </div>

    <div class="subscribe-box">
      <input type="email" placeholder="Email">
      <button>→</button>
    </div>
  </div>

  <footer>
    © 2025, SaveNow Powered by Shopify ·
    <a href="#">Refund policy</a> ·
    <a href="#">Privacy policy</a> ·
    <a href="#">Terms of service</a> ·
    <a href="#">Shipping policy</a> ·
    <a href="#">Contact information</a>
  </footer>

</body>
</html>
